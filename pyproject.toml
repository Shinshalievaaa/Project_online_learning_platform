[tool.poetry]
name = "project-online-learning-platform"
version = "0.1.0"
description = "Online learning platform backend"
authors = ["Aigul <test@example.com>"]
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
django = ">=5.0,<6.0"
djangorestframework = "^3.15.0"
djangorestframework-simplejwt = "^5.3.1"
django-filter = "^24.1"
django-celery-beat = "^2.6.0"
python-dotenv = "^1.0.1"
psycopg2-binary = "^2.9.9"
pillow = "^10.2.0"
coverage = "^7.4.3"
drf-yasg = "^1.21.7"
stripe = "^8.8.0"
celery = "^5.3.6"
redis = "^5.0.3"
eventlet = "^0.35.2"
gunicorn = "^21.2.0"

[tool.poetry.group.lint.dependencies]
black = "^24.2.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"